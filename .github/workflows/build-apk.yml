name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: krugi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: krugi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: krugi-apk
          path: krugi/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk krugi.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest krugi.apk --repo "${{ github.repository }}" --title "Кружки (APK)" --notes "Свежая сборка приложения" --target "${{ github.sha }}"
